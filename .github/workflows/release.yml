# Yeni sürüm yayınla: package.json "version" alanını artır, commit et, aynı numarayla etiket gönder:
#   git tag v2.0.1 && git push origin v2.0.1
# Bu iş akışı:
#   1) web içeriğini derler ve OTA paketini (web-bundle.zip + update.json) üretir,
#   2) Android APK'yı derler ve imzalar,
#   3) hepsini GitHub Release'e koyar. Telefondaki uygulama update.json'u buradan okur.
name: Release (APK + uzaktan güncelleme)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sürüm etiketini kontrol et
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Etiket ${GITHUB_REF_NAME}, package.json sürümü $VERSION ile aynı olmalı (v$VERSION)."
            exit 1
          fi

      - name: Web içeriğini ve OTA paketini derle
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          npm run build
          node scripts/make-update-bundle.mjs "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.ver.outputs.version }}" "$(git log -1 --pretty=%s)"

      - name: Android projesini eşitle
        run: npx cap sync android

      - name: İmza anahtarını hazırla
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret yok. Debug imzalı APK üretilecek; sonraki APK'lar bunun üzerine KURULAMAYABİLİR. Rehberdeki imza adımını tamamla."
          fi

      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist-ota/dam-la-${{ steps.ver.outputs.version }}.apk"
            cp app/build/outputs/apk/release/app-release.apk "../dist-ota/dam-la.apk"  # sabit ad: kurulum rehberi hep releases/latest/download/dam-la.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist-ota/dam-la-${{ steps.ver.outputs.version }}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "../dist-ota/dam-la.apk"
          fi

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: dam-la ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            **Telefona ilk kurulum:** Android için `.apk` dosyasını telefonda indirip aç. iPhone için "iOS IPA" iş akışının çıktısını kullan (KURULUM.md).
            **Zaten kuruluysa:** bir şey yapma — uygulama açılışta bu sürümü kendisi indirir (Ayarlar › Uygulama güncellemeleri).
          files: |
            dist-ota/web-bundle.zip
            dist-ota/update.json
            dist-ota/*.apk
      - name: Kurulum rehberini (/indir/) yenile
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} || echo "rehber yenilenemedi (sonraki push'ta yenilenir)"
