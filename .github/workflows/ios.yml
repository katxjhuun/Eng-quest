# iPhone için imzasız .ipa üretir (Mac gerekmez; GitHub'ın macOS sunucusunda derlenir).
# Çıkan dosya Sideloadly / SideStore / AltStore ile kendi Apple hesabınla imzalanıp kurulur.
# Çalıştırma: GitHub > Actions > "iOS IPA" > Run workflow
name: iOS IPA (imzasız)

on:
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: 'IPA dosyasını bu sürüm etiketine de ekle (ör. v2.0.0, boş bırakılabilir)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Derle ve iOS projesini eşitle
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Xcode ile imzasız derle
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          VERSION=$(node -p "require('./package.json').version")
          zip -qr "EnglishQuest-$VERSION-unsigned.ipa" Payload
          echo "IPA=EnglishQuest-$VERSION-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishQuest-iOS-ipa
          path: ${{ env.IPA }}

      - name: Sürüme ekle (isteğe bağlı)
        if: ${{ inputs.attach_to_release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.attach_to_release }}" "$IPA" --clobber
